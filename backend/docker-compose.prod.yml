version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api
      DATABASE_URL: postgresql://${POSTGRES_USER:-pos_admin}:${POSTGRES_PASSWORD:-ChangeThisSecureDbPassword2026!}@postgres:5432/${POSTGRES_DB:-hungry_howies_pos}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-very-secure-random-secret-key-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      REDIS_URL: redis://:${REDIS_PASSWORD:-ChangeThisSecureRedisPassword2026!}@redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pos_network

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisSecureDbPassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-hungry_howies_pos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos_admin} -d ${POSTGRES_DB:-hungry_howies_pos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pos_network

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-ChangeThisSecureRedisPassword2026!}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ChangeThisSecureRedisPassword2026!}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pos_network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - pos_network

volumes:
  postgres_data:
  redis_data:

networks:
  pos_network:
    driver: bridge
