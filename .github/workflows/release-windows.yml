name: Release Windows

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'build_windows_release.ps1']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute next version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release list --limit 1 --json tagName --jq '.[0].tagName // empty'
          if (-not $tag) { $next = '1.0.0' }
          else {
            $p = $tag.TrimStart('v').Split('.')
            $next = "$($p[0]).$($p[1]).$([int]$p[2] + 1)"
          }
          "version=$next" >> $env:GITHUB_OUTPUT

      - name: Set version in pubspec (build machine only)
        shell: pwsh
        run: |
          $f = 'frontend/pubspec.yaml'
          (Get-Content $f) -replace '^version:.*', "version: ${{ steps.ver.outputs.version }}+${{ github.run_number }}" | Set-Content $f

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: ./build_windows_release.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = 'frontend/build/installer/Hungry-Howies-POS-Windows-x64-Setup.exe'
          if (-not (Test-Path $exe)) { throw "Installer not found: $exe" }
          gh release create "v${{ steps.ver.outputs.version }}" $exe `
            --title "Hungry Howie's POS v${{ steps.ver.outputs.version }}" --generate-notes
