name: Deploy Hungry Howie's POS Backend

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H '${{ secrets.DEPLOY_HOST }}' >> ~/.ssh/known_hosts

      - name: Deploy Backend
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' << 'EOF'

          set -e

          cd /opt/howiespos/backend

          echo "=== Fetching latest code ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== Installing dependencies ==="
          npm ci

          echo "=== Generating Prisma Client ==="
          npx prisma generate

          echo "=== Running database migrations ==="
          npx prisma migrate deploy

          echo "=== Building backend ==="
          npm run build

          echo "=== Restarting backend ==="
          systemctl restart howiespos

          echo "=== Checking service ==="
          systemctl is-active --quiet howiespos

          echo "=== Checking API health ==="
          sleep 3
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/api/health

          echo ""
          echo "=== DEPLOYMENT SUCCESSFUL ==="

          EOF
