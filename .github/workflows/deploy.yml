name: Deploy Hungry Howie's POS Backend

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H '${{ secrets.DEPLOY_HOST }}' >> ~/.ssh/known_hosts

      - name: Deploy Backend
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' << 'EOF'

          set -e

          cd /opt/howiespos/backend

          echo "=== Fetching latest code ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== Installing dependencies ==="
          npm ci

          echo "=== Generating Prisma Client ==="
          npx prisma generate

          echo "=== Running database migrations ==="
          npx prisma migrate deploy

          echo "=== Building backend ==="
          npm run build

          echo "=== Restarting backend ==="
          systemctl restart howiespos

          echo "=== Checking service ==="
          systemctl is-active --quiet howiespos

          echo "=== Checking API health ==="
          HEALTH_URL="http://127.0.0.1:3000/api/health"
          MAX_ATTEMPTS=15
          DELAY_SECONDS=2
          ATTEMPT=1
          HEALTH_OK=false

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT of $MAX_ATTEMPTS..."
            if response=$(curl --fail --silent --show-error "$HEALTH_URL" 2>/dev/null); then
              echo "Health check succeeded: $response"
              HEALTH_OK=true
              break
            fi
            sleep $DELAY_SECONDS
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$HEALTH_OK" = false ]; then
            echo "=== Health check failed after 30 seconds ==="
            echo "--- systemctl status howiespos ---"
            systemctl status howiespos --no-pager || true
            echo "--- recent journalctl logs ---"
            journalctl -u howiespos -n 50 --no-pager || true
            exit 1
          fi

          echo ""
          echo "=== DEPLOYMENT SUCCESSFUL ==="

          EOF
