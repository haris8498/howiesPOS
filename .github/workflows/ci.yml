name: CI/CD Pipeline - Hungry Howie's POS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-qa:
    name: Backend CI (Lint, Test, Build, Prisma Validate)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: hungry_howies_pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Validate Prisma schema
        working-directory: ./backend
        run: npx prisma validate

      - name: Run backend linter
        working-directory: ./backend
        run: npm run lint

      - name: Run backend unit and regression tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/hungry_howies_pos_test?schema=public
          JWT_SECRET: ci-test-secret-key-2026
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm test

      - name: Build production bundle
        working-directory: ./backend
        run: npm run build

  frontend-qa:
    name: Frontend CI (Analyze & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Run Flutter static analysis
        working-directory: ./frontend
        run: flutter analyze

      - name: Run Flutter unit tests
        working-directory: ./frontend
        run: flutter test
